# Microservice specific
helios.registration-safety-token=${HELIOS_SAFETY_TOKEN:development-token}

helios.service-type=${HELIOS_SERVICE_TYPES:apple}
helios.use-production-server=${HELIOS_APN_IS_PRODUCTION:false}
helios.apns.key-id=${HELIOS_APN_KEYID:KEYID12345}
helios.apns.team-id=${HELIOS_APN_TEAMID:TEAMID6789}
helios.apns.bundle-id=${HELIOS_BUNDLEID:software.baig.Helios-Mobile}

# Server/Spring
server.port=8090
server.http2.enabled=true
server.tomcat.max-swallow-size=-1
spring.threads.virtual.enabled=true

# Database
spring.datasource.url=${JDBC_URL:jdbc:h2:file:./database;AUTO_SERVER=TRUE}
spring.datasource.username=${POSTGRESQL_USER:sa}
spring.datasource.password=${POSTGRESQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${HIKARICP_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${HIKARICP_MIN_POOL_SIZE:1}
spring.datasource.hikari.idle-timeout=${HIKARICP_IDLE_TIMEOUT:60000}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.liquibase.changeLog=classpath:/db/changelog/db-master.xml
